version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: infintime_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: infintime_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: infintime_backend
    ports:
      - "8080:80"
    depends_on:
      - database

volumes:
  db_data: